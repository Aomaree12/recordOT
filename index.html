<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบบันทึกและเบิก OT พยาบาล</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body { background-color: #f8fafc; font-family: 'Sarabun', sans-serif; overflow-x: hidden; }
    .calendar-card { background: white; border-radius: 1rem; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); width: 100%; }
    
    .cell { min-height: 85px; border: 1px solid #e2e8f0; cursor: pointer; transition: 0.2s; padding: 2px; overflow: hidden;}
    @media (min-width: 768px) { .cell { min-height: 120px; padding: 6px; } }
    
    .cell:hover { background-color: #f1f5f9; z-index: 5; }
    .cell.today { background-color: #f0fdfa; border: 2px solid #0d9488 !important; }
    .cell.weekend { background-color: #f8fafc; }
    
    .event-badge { 
      font-size: 9px; padding: 3px 4px; border-radius: 6px; margin-bottom: 2px; 
      line-height: 1.3; display: block; text-align: left; 
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    @media (min-width: 768px) { .event-badge { font-size: 11px; padding: 4px; white-space: normal; } }
    
    .modal-close { cursor: pointer; transition: 0.3s; }
    .modal-close:hover { color: #f43f5e; transform: rotate(90deg); }

    /* Custom scrollbar for modal */
    .custom-scroll::-webkit-scrollbar { width: 5px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
  </style>
</head>
<body class="p-2 md:p-4 pb-20 w-full">

  <div class="max-w-6xl mx-auto w-full">
    <div class="flex flex-col md:flex-row justify-between items-center mb-4 gap-3">
      <div class="flex items-center gap-3">
        <div class="bg-teal-600 w-10 h-10 rounded-xl flex items-center justify-center text-white text-lg shadow-md">
          <i class="fas fa-file-invoice-dollar"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold text-slate-800">ระบบเบิก OT</h1>
          <p class="text-[10px] text-teal-600 font-bold" id="currentDateDisplay"></p>
        </div>
      </div>

      <div class="flex items-center gap-1 bg-white p-1 rounded-xl shadow-sm border border-slate-200 w-full justify-between md:w-auto">
        <button onclick="changeMonth(-1)" class="w-8 h-8 rounded-lg hover:bg-slate-100 text-slate-600"><i class="fas fa-chevron-left"></i></button>
        <h2 id="monthTitle" class="text-sm font-bold text-slate-700 min-w-[120px] text-center uppercase">...</h2>
        <button onclick="changeMonth(1)" class="w-8 h-8 rounded-lg hover:bg-slate-100 text-slate-600"><i class="fas fa-chevron-right"></i></button>
        <div class="hidden md:block h-5 w-[1px] bg-slate-200 mx-1"></div>
        <button onclick="openEditForm()" class="bg-teal-600 hover:bg-teal-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1 shadow-sm">
          <i class="fas fa-plus"></i> ลง OT
        </button>
      </div>
    </div>

    <div class="calendar-card overflow-hidden border border-slate-200">
      <div class="calendar-grid bg-slate-50 border-b border-slate-200">
        <div class="py-2 text-center text-[10px] font-bold text-slate-500">จ.</div>
        <div class="py-2 text-center text-[10px] font-bold text-slate-500">อ.</div>
        <div class="py-2 text-center text-[10px] font-bold text-slate-500">พ.</div>
        <div class="py-2 text-center text-[10px] font-bold text-slate-500">พฤ.</div>
        <div class="py-2 text-center text-[10px] font-bold text-slate-500">ศ.</div>
        <div class="py-2 text-center text-[10px] font-bold text-indigo-500">ส.</div>
        <div class="py-2 text-center text-[10px] font-bold text-rose-500">อา.</div>
      </div>
      <div id="calendarDays" class="calendar-grid"></div>
    </div>
  </div>

  <div id="viewModal" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center p-2">
    <div class="bg-white rounded-[1.5rem] w-full max-w-md shadow-2xl relative overflow-hidden flex flex-col max-h-[90vh]">
      <div class="absolute top-4 right-4 text-2xl text-slate-400 modal-close z-10" onclick="closeModal('viewModal')">&times;</div>
      <div class="p-6 overflow-y-auto custom-scroll w-full" id="viewContent"></div>
    </div>
  </div>

  <div id="editModal" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center p-2">
    <div class="bg-white rounded-[1.5rem] w-full max-w-lg shadow-2xl relative overflow-hidden flex flex-col max-h-[95vh]">
      <div class="absolute top-4 right-4 text-2xl text-slate-400 modal-close z-10" onclick="closeModal('editModal')">&times;</div>
      <div class="p-6 overflow-y-auto custom-scroll w-full">
        <h3 class="text-xl font-black text-slate-800 mb-4" id="modalTitle">ลงบันทึกเบิก OT</h3>
        <form id="otForm" onsubmit="handleSave(event)" class="grid grid-cols-2 gap-3">
          
          <input type="hidden" id="f_rowIndex"> <input type="hidden" id="v_file1"> <input type="hidden" id="v_file2">

          <div class="col-span-2">
            <label class="text-[10px] font-bold text-slate-500 ml-1 block">วันที่</label>
            <input type="date" id="f_date_raw" onchange="updateThaiDateDisplay()" required class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-teal-500">
            <input type="hidden" id="f_date_thai">
          </div>
          
          <div class="col-span-2">
            <label class="text-[10px] font-bold text-slate-500 ml-1 block">พยาบาลผู้เบิก</label>
            <select id="f_name" required class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-teal-500 font-bold text-slate-700"></select>
          </div>
          
          <div class="col-span-2">
            <label class="text-[10px] font-bold text-slate-500 ml-1 block">เวร</label>
            <select id="f_shift" required class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-teal-500 font-bold text-teal-700">
              <option value="HDD5">HDD5</option>
              <option value="HDE5">HDE5</option>
              <option value="HDN5">HDN5</option>
            </select>
          </div>
          
          <div>
            <label class="text-[10px] font-bold text-slate-500 ml-1 block">เวลามา</label>
            <input type="time" lang="th-TH" id="f_timeIn" oninput="calculateTotal()" required class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-teal-500 font-bold">
          </div>
          <div>
            <label class="text-[10px] font-bold text-slate-500 ml-1 block">เวลากลับ</label>
            <input type="time" lang="th-TH" id="f_timeOut" oninput="calculateTotal()" required class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-teal-500 font-bold">
          </div>

          <div class="col-span-2 bg-teal-50 border border-teal-200 rounded-xl p-3 flex justify-between items-center mt-1">
            <div>
              <p class="text-[10px] text-teal-600 font-bold uppercase">รวมเวลาปฏิบัติงาน</p>
              <p class="text-xl font-black text-teal-800" id="display_totalTime">0.00 ชม.</p>
            </div>
            <div class="text-right">
              <p class="text-[10px] text-rose-500 font-bold uppercase">รวมเงินเบิกได้</p>
              <p class="text-xl font-black text-rose-600" id="display_totalMoney">฿0.00</p>
            </div>
          </div>
          
          <div class="col-span-2 border-t border-slate-100 pt-3 mt-1">
            <label class="text-[10px] font-bold text-rose-500 ml-1 block"><i class="fas fa-file-upload"></i> อัปโหลดเอกสารเคสที่ 1 ใหม่ (ถ้ามี)</label>
            <input type="file" id="f_file1" class="w-full text-xs text-slate-500 cursor-pointer bg-slate-50 rounded-lg p-2 border border-slate-200">
            <p id="file1_status" class="text-[9px] text-teal-600 mt-1 hidden"><i class="fas fa-check-circle"></i> มีไฟล์เดิมอยู่แล้ว</p>
          </div>
          <div class="col-span-2">
            <label class="text-[10px] font-bold text-rose-500 ml-1 block"><i class="fas fa-file-upload"></i> อัปโหลดเอกสารเคสที่ 2 ใหม่ (ถ้ามี)</label>
            <input type="file" id="f_file2" class="w-full text-xs text-slate-500 cursor-pointer bg-slate-50 rounded-lg p-2 border border-slate-200">
            <p id="file2_status" class="text-[9px] text-teal-600 mt-1 hidden"><i class="fas fa-check-circle"></i> มีไฟล์เดิมอยู่แล้ว</p>
          </div>

          <button type="submit" class="col-span-2 mt-2 w-full bg-teal-600 text-white font-bold py-3 rounded-lg shadow-md hover:bg-teal-700 transition-all flex justify-center items-center gap-2 text-sm">
            <i class="fas fa-save"></i> บันทึกข้อมูล
          </button>
        </form>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 🔴 1. วาง URL Web App ของคุณในบรรทัดนี้!
    // ==========================================
    const API_URL = "https://script.google.com/macros/s/AKfycbzXxyPyvQ-5ulN_ZyJeOZbTHdYVOIz53TnxWtlbdiFSgQtBZdPpR8__EGjCQgeokAhmKg/exec"; 
    // ==========================================

    const thaiMonths = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
    let otData = [], nameList = [], currentViewDate = new Date();

    const colorPalettes = [
      { bg: 'bg-pink-50', text: 'text-pink-700', border: 'border-pink-300', badge: 'bg-pink-50 text-pink-700 border-l-[3px] border-pink-400' },
      { bg: 'bg-blue-50', text: 'text-blue-700', border: 'border-blue-300', badge: 'bg-blue-50 text-blue-700 border-l-[3px] border-blue-400' },
      { bg: 'bg-emerald-50', text: 'text-emerald-700', border: 'border-emerald-300', badge: 'bg-emerald-50 text-emerald-700 border-l-[3px] border-emerald-400' },
      { bg: 'bg-amber-50', text: 'text-amber-700', border: 'border-amber-300', badge: 'bg-amber-50 text-amber-700 border-l-[3px] border-amber-400' }
    ];

    function getColorForName(name) {
      let idx = nameList.indexOf(name);
      if (idx === -1) idx = 0;
      return colorPalettes[idx % colorPalettes.length];
    }

    window.onload = () => { fetchData(); updateHeaderDate(); };
    
    function updateHeaderDate() {
      const now = new Date();
      document.getElementById('currentDateDisplay').innerText = `วันนี้: ${now.getDate()} ${thaiMonths[now.getMonth()]} ${now.getFullYear() + 543}`;
    }

    async function fetchData() {
      if(!API_URL.includes("script.google.com")) {
        Swal.fire("แจ้งเตือน", "กรุณาใส่ลิงก์ API_URL ในโค้ดก่อนใช้งาน", "error"); return;
      }
      Swal.fire({ title: 'กำลังโหลด...', didOpen: () => Swal.showLoading() });
      try {
        const response = await fetch(API_URL + "?action=getData");
        const resData = await response.json();
        otData = resData.otData;
        nameList = resData.names; 
        
        populateNameDropdown();
        renderCalendar(); 
        Swal.close();
      } catch (error) {
        Swal.fire("ข้อผิดพลาด", "ไม่สามารถดึงข้อมูลได้", "error");
      }
    }

    function populateNameDropdown() {
      const select = document.getElementById('f_name');
      if (nameList.length === 0) {
        select.innerHTML = `<option value="">ไม่พบรายชื่อในชีต</option>`; return;
      }
      select.innerHTML = nameList.map(n => `<option value="${n}">${n}</option>`).join('');
    }

    function parseThaiDate(dateStr) {
      if (!dateStr) return null;
      const parts = dateStr.trim().split(/\s+/);
      if (parts.length < 3) return null;
      const d = parseInt(parts[0]), m = thaiMonths.indexOf(parts[1]), y = parseInt(parts[2]) - 543;
      return new Date(y, m, d);
    }

    function renderCalendar() {
      const daysDiv = document.getElementById('calendarDays');
      daysDiv.innerHTML = '';
      const vY = currentViewDate.getFullYear(), vM = currentViewDate.getMonth();
      document.getElementById('monthTitle').innerText = `${thaiMonths[vM]} ${vY + 543}`;

      let firstDay = new Date(vY, vM, 1).getDay();
      let startOffset = firstDay === 0 ? 6 : firstDay - 1; 

      const daysInMonth = new Date(vY, vM + 1, 0).getDate();
      for (let i = 0; i < startOffset; i++) daysDiv.innerHTML += `<div class="cell bg-slate-50/50 border-0"></div>`;

      for (let day = 1; day <= daysInMonth; day++) {
        const dObj = new Date(vY, vM, day), dow = dObj.getDay();
        const isWE = (dow === 0 || dow === 6), isToday = dObj.toDateString() === new Date().toDateString();
        
        const dayEvents = otData.filter(it => {
          const itD = parseThaiDate(it.date);
          return itD && itD.getDate() === day && itD.getMonth() === vM && itD.getFullYear() === vY;
        });

        daysDiv.innerHTML += `
          <div class="cell ${isToday ? 'today' : ''} ${isWE ? 'weekend' : ''}" onclick="showDetails(${day}, ${vM}, ${vY})">
            <span class="text-[9px] font-bold ${dow === 0 ? 'text-rose-500' : (dow === 6 ? 'text-indigo-500' : 'text-slate-400')}">${day}</span>
            <div class="mt-1 space-y-[2px]">
              ${dayEvents.map(ev => {
                let colors = getColorForName(ev.name);
                let shortName = ev.name.split(' ')[0]; 
                return `
                <div class="event-badge ${colors.badge}">
                  <span class="font-bold">${shortName}</span> <span class="text-[8px]">(${ev.shift})</span>
                  ${ev.timeIn ? `<br><span class="text-[7px] text-slate-500">${ev.timeIn} น. - ${ev.timeOut} น.</span>` : ''}
                  ${ev.totalTime ? `<br><span class="text-[8px] font-bold text-teal-700">${ev.totalTime} ชม. | ฿${ev.totalMoney}</span>` : ''}
                </div>`;
              }).join('')}
            </div>
          </div>`;
      }
    }

    function showDetails(day, month, year) {
      const tDate = `${day} ${thaiMonths[month]} ${year + 543}`;
      const evs = otData.filter(it => it.date === tDate);
      let html = `<div class="text-center mb-4"><p class="text-teal-600 font-black text-lg">${tDate}</p></div>`;
      
      if(evs.length === 0) {
        html += `<p class="text-center text-slate-400 py-4 text-xs">ไม่มีข้อมูลเบิก OT ในวันนี้</p>`;
      } else {
        evs.forEach(ev => {
          let colors = getColorForName(ev.name);
          html += `
          <div class="p-4 rounded-2xl ${colors.bg} border ${colors.border} mb-3 shadow-sm relative">
            
            <button onclick="editEntry(${ev.rowIndex})" class="absolute top-3 right-3 w-8 h-8 rounded-full bg-white text-teal-600 shadow-md flex justify-center items-center hover:bg-teal-50 transition-all text-xs">
              <i class="fas fa-edit"></i>
            </button>

            <p class="font-bold text-base ${colors.text} pr-8">${ev.name}</p>
            <div class="mt-2 grid grid-cols-2 gap-2 text-[10px] text-slate-600 bg-white/60 p-2 rounded-xl">
              <div><span class="text-slate-400 block">เวร</span><span class="font-bold text-slate-700">${ev.shift}</span></div>
              <div><span class="text-slate-400 block">เวลา</span><span class="font-bold text-slate-700">${ev.timeIn || '-'} น. ถึง ${ev.timeOut || '-'} น.</span></div>
              <div><span class="text-slate-400 block">รวมเวลา</span><span class="font-bold text-teal-600">${ev.totalTime || 0} ชม.</span></div>
              <div><span class="text-slate-400 block">รวมเงิน</span><span class="font-bold text-rose-600">฿${ev.totalMoney || 0}</span></div>
            </div>
            <div class="mt-2 flex gap-1">
              ${ev.file1 ? `<a href="${ev.file1}" target="_blank" class="flex-1 bg-white border border-slate-200 text-center py-1.5 rounded-lg text-[9px] font-bold shadow-sm"><i class="fas fa-file-pdf text-rose-500"></i> ไฟล์ 1</a>` : ''}
              ${ev.file2 ? `<a href="${ev.file2}" target="_blank" class="flex-1 bg-white border border-slate-200 text-center py-1.5 rounded-lg text-[9px] font-bold shadow-sm"><i class="fas fa-file-pdf text-rose-500"></i> ไฟล์ 2</a>` : ''}
            </div>
          </div>`;
        });
      }
      document.getElementById('viewContent').innerHTML = html;
      openModal('viewModal');
    }

    function openEditForm() {
      const vY = currentViewDate.getFullYear(), vM = String(currentViewDate.getMonth() + 1).padStart(2, '0');
      document.getElementById('otForm').reset();
      document.getElementById('modalTitle').innerText = "ลงบันทึกเบิก OT (ใหม่)";
      document.getElementById('f_rowIndex').value = ""; // เคลียร์แถว
      document.getElementById('v_file1').value = "";
      document.getElementById('v_file2').value = "";
      document.getElementById('file1_status').classList.add('hidden');
      document.getElementById('file2_status').classList.add('hidden');
      
      document.getElementById('f_date_raw').value = `${vY}-${vM}-01`; 
      updateThaiDateDisplay(); 
      calculateTotal(); // รีเซ็ตกล่องคำนวณ
      openModal('editModal');
    }

    // ฟังก์ชันดึงข้อมูลมาแก้ไข
    function editEntry(rowIndex) {
      closeModal('viewModal'); // ปิดหน้าต่าง View ก่อน
      
      const ev = otData.find(d => d.rowIndex == rowIndex);
      if(!ev) return;

      document.getElementById('modalTitle').innerText = "แก้ไขข้อมูล OT";
      document.getElementById('f_rowIndex').value = ev.rowIndex;
      
      // แปลงวันที่ไทยกลับไปเป็น YYYY-MM-DD เพื่อแสดงใน Input Date
      const dObj = parseThaiDate(ev.date);
      if (dObj) {
        const mm = String(dObj.getMonth() + 1).padStart(2, '0');
        const dd = String(dObj.getDate()).padStart(2, '0');
        document.getElementById('f_date_raw').value = `${dObj.getFullYear()}-${mm}-${dd}`;
      }
      updateThaiDateDisplay();

      document.getElementById('f_name').value = ev.name;
      document.getElementById('f_shift').value = ev.shift;
      document.getElementById('f_timeIn').value = ev.timeIn;
      document.getElementById('f_timeOut').value = ev.timeOut;
      
      // เก็บลิงก์ไฟล์เก่าไว้
      document.getElementById('v_file1').value = ev.file1 || "";
      document.getElementById('v_file2').value = ev.file2 || "";
      
      document.getElementById('file1_status').classList.toggle('hidden', !ev.file1);
      document.getElementById('file2_status').classList.toggle('hidden', !ev.file2);

      calculateTotal(); // คำนวณยอดใหม่ให้เห็น
      openModal('editModal');
    }

    function updateThaiDateDisplay() {
      const val = document.getElementById('f_date_raw').value; if(!val) return;
      const d = new Date(val); document.getElementById('f_date_thai').value = `${d.getDate()} ${thaiMonths[d.getMonth()]} ${d.getFullYear() + 543}`;
    }

    // ฟังก์ชันคำนวณเวลาและเงินสดๆ ในหน้าฟอร์ม
    function calculateTotal() {
      let tIn = document.getElementById('f_timeIn').value;
      let tOut = document.getElementById('f_timeOut').value;
      
      if(tIn && tOut) {
        let [h1, m1] = tIn.split(':').map(Number);
        let [h2, m2] = tOut.split(':').map(Number);
        let d1 = new Date(2000, 0, 1, h1, m1);
        let d2 = new Date(2000, 0, 1, h2, m2);
        
        if (d2 < d1) d2.setDate(d2.getDate() + 1); // กรณีทำข้ามคืน
        
        let totalTime = (d2 - d1) / (1000 * 60 * 60);
        let totalMoney = totalTime * 81.25;

        document.getElementById('display_totalTime').innerText = totalTime.toFixed(2) + " ชม.";
        document.getElementById('display_totalMoney').innerText = "฿" + totalMoney.toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2});
      } else {
        document.getElementById('display_totalTime').innerText = "0.00 ชม.";
        document.getElementById('display_totalMoney').innerText = "฿0.00";
      }
    }

    const toBase64 = file => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result);
      reader.onerror = error => reject(error);
    });

    async function handleSave(e) {
      e.preventDefault();
      
      let tIn = document.getElementById('f_timeIn').value;
      let tOut = document.getElementById('f_timeOut').value;
      let totalTime = 0, totalMoney = 0;
      
      if(tIn && tOut) {
        let [h1, m1] = tIn.split(':').map(Number);
        let [h2, m2] = tOut.split(':').map(Number);
        let d1 = new Date(2000, 0, 1, h1, m1);
        let d2 = new Date(2000, 0, 1, h2, m2);
        if (d2 < d1) d2.setDate(d2.getDate() + 1);
        totalTime = (d2 - d1) / (1000 * 60 * 60);
        totalMoney = totalTime * 81.25;
      }

      Swal.fire({ title: 'กำลังบันทึก...', html: 'รอสักครู่ ระบบกำลังประมวลผล', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      
      const f1 = document.getElementById('f_file1').files[0];
      const f2 = document.getElementById('f_file2').files[0];

      const payload = { 
        rowIndex: document.getElementById('f_rowIndex').value, // ส่ง rowIndex กลับไปด้วย (เพื่อบอกว่าเป็นการแก้ไข)
        date: document.getElementById('f_date_thai').value, 
        name: document.getElementById('f_name').value, 
        shift: document.getElementById('f_shift').value,
        timeIn: tIn,
        timeOut: tOut,
        totalTime: totalTime > 0 ? totalTime.toFixed(2) : "",
        totalMoney: totalMoney > 0 ? totalMoney.toFixed(2) : "",
        file1: document.getElementById('v_file1').value, // ส่งลิงก์ไฟล์เก่ากลับไป
        file2: document.getElementById('v_file2').value,
        file1Data: f1 ? await toBase64(f1) : null,
        file1Name: f1 ? f1.name : "",
        file2Data: f2 ? await toBase64(f2) : null,
        file2Name: f2 ? f2.name : ""
      };
      
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'saveOT', payload: payload }),
          headers: { 'Content-Type': 'text/plain;charset=utf-8' }
        });
        const result = await response.json();
        closeModal('editModal');
        Swal.fire({ icon: 'success', title: 'สำเร็จ', text: result.message, timer: 2000 });
        fetchData();
      } catch (error) {
        Swal.fire("ข้อผิดพลาด", "การเชื่อมต่อล้มเหลว", "error");
      }
    }

    function changeMonth(o) { currentViewDate.setMonth(currentViewDate.getMonth() + o); renderCalendar(); }
    function openModal(id) { document.getElementById(id).classList.remove('hidden'); document.getElementById(id).classList.add('flex'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); document.getElementById(id).classList.remove('flex'); }
  </script>
</body>
</html>
