<div id="editModal" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-md hidden items-center justify-center p-4">
  <div class="bg-white rounded-[2.5rem] w-full max-w-lg shadow-2xl relative overflow-y-auto max-h-[90vh]">
    <div class="absolute top-6 right-8 text-3xl text-slate-300 modal-close" onclick="closeModal('editModal')">&times;</div>
    <div class="p-8">
      <h3 class="text-2xl font-black text-slate-800 mb-6">บันทึกเบิกค่าตอบแทน (OT)</h3>
      <form onsubmit="handleSave(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="md:col-span-2">
          <label class="text-xs font-bold text-teal-600 uppercase ml-1">วันที่ปฏิบัติงาน</label>
          <input type="date" id="f_date_raw" onchange="updateThaiDateDisplay()" required class="w-full bg-slate-50 border-2 border-teal-50 rounded-xl px-4 py-3 outline-none">
          <input type="hidden" id="f_date_thai">
        </div>
        <div>
          <label class="text-xs font-bold text-teal-600 uppercase ml-1">ชื่อพยาบาล</label>
          <select id="f_name" required class="w-full bg-slate-50 border-2 border-teal-50 rounded-xl px-4 py-3 outline-none">
            <option value="อ้อมอารีย์ พุทธาวันดี">อ้อมอารีย์ พุทธาวันดี</option>
            <option value="สุกัญญา สวัสดิวงศ์">สุกัญญา สวัสดิวงศ์</option>
          </select>
        </div>
        <div>
          <label class="text-xs font-bold text-teal-600 uppercase ml-1">เวร</label>
          <select id="f_shift" class="w-full bg-slate-50 border-2 border-teal-50 rounded-xl px-4 py-3 outline-none">
            <option value="เช้า">เช้า</option><option value="บ่าย">บ่าย</option><option value="ดึก">ดึก</option>
          </select>
        </div>
        <div>
          <label class="text-xs font-bold text-teal-600 uppercase ml-1">เวลามา</label>
          <input type="time" id="f_timeIn" class="w-full bg-slate-50 border-2 border-teal-50 rounded-xl px-4 py-3 outline-none">
        </div>
        <div>
          <label class="text-xs font-bold text-teal-600 uppercase ml-1">เวลากลับ</label>
          <input type="time" id="f_timeOut" class="w-full bg-slate-50 border-2 border-teal-50 rounded-xl px-4 py-3 outline-none">
        </div>
        
        <div class="md:col-span-2 border-t pt-4 mt-2">
          <label class="text-xs font-bold text-rose-500 uppercase ml-1">แนบไฟล์เคสที่ 1 (PDF/รูปภาพ)</label>
          <input type="file" id="f_file1" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-teal-50 file:text-teal-700 hover:file:bg-teal-100">
          <input type="hidden" id="v_file1">
        </div>
        
        <div class="md:col-span-2">
          <label class="text-xs font-bold text-rose-500 uppercase ml-1">แนบไฟล์เคสที่ 2 (PDF/รูปภาพ)</label>
          <input type="file" id="f_file2" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-teal-50 file:text-teal-700 hover:file:bg-teal-100">
          <input type="hidden" id="v_file2">
        </div>

        <button type="submit" class="md:col-span-2 mt-4 bg-teal-600 text-white font-black py-4 rounded-2xl shadow-xl hover:bg-teal-700 transition-all">บันทึกและอัปโหลดไฟล์</button>
      </form>
    </div>
  </div>
</div>
