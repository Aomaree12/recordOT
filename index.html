<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบบันทึกและเบิก OT พยาบาล</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body { background-color: #f8fafc; font-family: 'Sarabun', sans-serif; }
    .calendar-card { background: white; border-radius: 1.5rem; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
    
    /* แก้ไขเส้นตารางให้บางลง (1px) และสีนุ่มนวลขึ้น */
    .cell { min-height: 110px; border: 1px solid #e2e8f0; position: relative; cursor: pointer; transition: 0.2s; }
    @media (min-width: 768px) { .cell { min-height: 140px; } }
    
    .cell:hover { background-color: #f1f5f9; z-index: 5; }
    .cell.today { background-color: #f0fdfa; border: 2px solid #0d9488 !important; }
    .cell.weekend { background-color: #f8fafc; }
    
    .event-badge { font-size: 11px; padding: 4px 6px; border-radius: 6px; margin-bottom: 4px; line-height: 1.2; display: block; text-align: left;}
    @media (min-width: 768px) { .event-badge { font-size: 13px; } }
    
    .modal-close { cursor: pointer; transition: 0.3s; }
    .modal-close:hover { color: #f43f5e; transform: rotate(90deg); }
  </style>
</head>
<body class="p-2 md:p-6 pb-20">

  <div class="max-w-6xl mx-auto">
    <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
      <div class="flex items-center gap-4">
        <div class="bg-teal-600 w-12 h-12 rounded-2xl flex items-center justify-center text-white text-xl shadow-md">
          <i class="fas fa-file-invoice-dollar"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold text-slate-800">ระบบบันทึกและเบิก OT</h1>
          <p class="text-xs text-teal-600 font-bold" id="currentDateDisplay"></p>
        </div>
      </div>

      <div class="flex items-center gap-2 bg-white p-2 rounded-2xl shadow-sm border border-slate-200">
        <button onclick="changeMonth(-1)" class="w-10 h-10 rounded-xl hover:bg-slate-100 flex items-center justify-center text-slate-600"><i class="fas fa-chevron-left"></i></button>
        <h2 id="monthTitle" class="text-lg font-bold text-slate-700 min-w-[150px] text-center uppercase">...</h2>
        <button onclick="changeMonth(1)" class="w-10 h-10 rounded-xl hover:bg-slate-100 flex items-center justify-center text-slate-600"><i class="fas fa-chevron-right"></i></button>
        <div class="h-6 w-[1px] bg-slate-200 mx-2"></div>
        <button onclick="openEditForm()" class="bg-teal-600 hover:bg-teal-700 text-white px-5 py-2 rounded-xl text-sm font-bold flex items-center gap-2 shadow-sm">
          <i class="fas fa-plus"></i> บันทึก OT
        </button>
      </div>
    </div>

    <div class="calendar-card overflow-hidden border border-slate-200">
      <div class="calendar-grid bg-slate-50 border-b border-slate-200">
        <div class="py-3 text-center text-xs font-bold text-slate-500">จันทร์</div>
        <div class="py-3 text-center text-xs font-bold text-slate-500">อังคาร</div>
        <div class="py-3 text-center text-xs font-bold text-slate-500">พุธ</div>
        <div class="py-3 text-center text-xs font-bold text-slate-500">พฤหัสบดี</div>
        <div class="py-3 text-center text-xs font-bold text-slate-500">ศุกร์</div>
        <div class="py-3 text-center text-xs font-bold text-indigo-500">เสาร์</div>
        <div class="py-3 text-center text-xs font-bold text-rose-500">อาทิตย์</div>
      </div>
      <div id="calendarDays" class="calendar-grid"></div>
    </div>
  </div>

  <div id="viewModal" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="bg-white rounded-[2rem] w-full max-w-md shadow-2xl relative overflow-hidden max-h-[90vh] flex flex-col">
      <div class="absolute top-6 right-6 text-2xl text-slate-400 modal-close z-10" onclick="closeModal('viewModal')">&times;</div>
      <div class="p-8 overflow-y-auto" id="viewContent"></div>
    </div>
  </div>

  <div id="editModal" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="bg-white rounded-[2rem] w-full max-w-xl shadow-2xl relative overflow-hidden flex flex-col max-h-[95vh]">
      <div class="absolute top-6 right-6 text-2xl text-slate-400 modal-close z-10" onclick="closeModal('editModal')">&times;</div>
      <div class="p-8 overflow-y-auto">
        <h3 class="text-2xl font-black text-slate-800 mb-6">บันทึกเบิกค่าตอบแทน (OT)</h3>
        <form id="otForm" onsubmit="handleSave(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="md:col-span-2">
            <label class="text-xs font-bold text-slate-500 uppercase ml-1 block mb-1">วันที่ปฏิบัติงาน</label>
            <input type="date" id="f_date_raw" onchange="updateThaiDateDisplay()" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:border-teal-500">
            <input type="hidden" id="f_date_thai">
          </div>
          <div class="md:col-span-2">
            <label class="text-xs font-bold text-slate-500 uppercase ml-1 block mb-1">พยาบาลผู้เบิก (อ้างอิงจากชีตรายชื่อ)</label>
            <select id="f_name" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:border-teal-500 font-bold">
              <option value="">กำลังโหลดรายชื่อ...</option>
            </select>
          </div>
          <div class="md:col-span-2">
            <label class="text-xs font-bold text-slate-500 uppercase ml-1 block mb-1">เวรที่ขึ้น</label>
            <select id="f_shift" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:border-teal-500 font-bold text-teal-700">
              <option value="HDD5">HDD5</option>
              <option value="HDE5">HDE5</option>
              <option value="HDN5">HDN5</option>
            </select>
          </div>
          <div>
            <label class="text-xs font-bold text-slate-500 uppercase ml-1 block mb-1">เวลามา</label>
            <input type="time" id="f_timeIn" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:border-teal-500">
          </div>
          <div>
            <label class="text-xs font-bold text-slate-500 uppercase ml-1 block mb-1">เวลากลับ</label>
            <input type="time" id="f_timeOut" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:border-teal-500">
          </div>
          
          <div class="md:col-span-2 border-t border-dashed border-slate-200 pt-4 mt-2">
            <label class="text-xs font-bold text-rose-500 uppercase ml-1 block mb-1"><i class="fas fa-file-upload"></i> แนบเอกสารเคสที่ 1</label>
            <input type="file" id="f_file1" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-bold file:bg-teal-50 file:text-teal-700 hover:file:bg-teal-100 cursor-pointer bg-slate-50 rounded-xl p-2 border border-slate-100">
          </div>
          <div class="md:col-span-2">
            <label class="text-xs font-bold text-rose-500 uppercase ml-1 block mb-1"><i class="fas fa-file-upload"></i> แนบเอกสารเคสที่ 2</label>
            <input type="file" id="f_file2" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-bold file:bg-teal-50 file:text-teal-700 hover:file:bg-teal-100 cursor-pointer bg-slate-50 rounded-xl p-2 border border-slate-100">
          </div>

          <button type="submit" class="md:col-span-2 mt-4 w-full bg-teal-600 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-teal-700 transition-all flex justify-center items-center gap-2">
            <i class="fas fa-cloud-upload-alt"></i> บันทึกและส่งข้อมูล
          </button>
        </form>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 🔴 1. วาง URL Web App ของคุณในบรรทัดนี้!
    // ==========================================
    const API_URL = "https://script.google.com/macros/s/AKfycbzXxyPyvQ-5ulN_ZyJeOZbTHdYVOIz53TnxWtlbdiFSgQtBZdPpR8__EGjCQgeokAhmKg/exec"; 
    // ==========================================

    const thaiMonths = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
    
    let otData = [];
    let nameList = []; // เก็บรายชื่อแบบไดนามิก
    let currentViewDate = new Date();

    // ชุดสีแบบสุ่มสำหรับรายชื่อที่ถูกดึงเข้ามาใหม่ (วนลูปสีอัตโนมัติ)
    const colorPalettes = [
      { bg: 'bg-pink-50', text: 'text-pink-700', border: 'border-pink-300', badge: 'bg-pink-100 text-pink-700 border-l-4 border-pink-400' },
      { bg: 'bg-blue-50', text: 'text-blue-700', border: 'border-blue-300', badge: 'bg-blue-100 text-blue-700 border-l-4 border-blue-400' },
      { bg: 'bg-emerald-50', text: 'text-emerald-700', border: 'border-emerald-300', badge: 'bg-emerald-100 text-emerald-700 border-l-4 border-emerald-400' },
      { bg: 'bg-amber-50', text: 'text-amber-700', border: 'border-amber-300', badge: 'bg-amber-100 text-amber-700 border-l-4 border-amber-400' },
      { bg: 'bg-purple-50', text: 'text-purple-700', border: 'border-purple-300', badge: 'bg-purple-100 text-purple-700 border-l-4 border-purple-400' }
    ];

    function getColorForName(name) {
      let idx = nameList.indexOf(name);
      if (idx === -1) idx = 0;
      return colorPalettes[idx % colorPalettes.length];
    }

    window.onload = () => { fetchData(); updateHeaderDate(); };
    
    function updateHeaderDate() {
      const now = new Date();
      document.getElementById('currentDateDisplay').innerText = `วันนี้: ${now.getDate()} ${thaiMonths[now.getMonth()]} ${now.getFullYear() + 543}`;
    }

    async function fetchData() {
      if(!API_URL.includes("script.google.com")) {
        Swal.fire("แจ้งเตือน", "กรุณาใส่ลิงก์ API_URL ในโค้ดก่อนใช้งาน", "error"); return;
      }
      Swal.fire({ title: 'กำลังโหลดข้อมูล...', didOpen: () => Swal.showLoading() });
      try {
        const response = await fetch(API_URL + "?action=getData");
        const resData = await response.json();
        otData = resData.otData;
        nameList = resData.names; // รับรายชื่อจาก Backend
        
        populateNameDropdown();
        renderCalendar(); 
        Swal.close();
      } catch (error) {
        Swal.fire("เชื่อมต่อล้มเหลว", "ไม่สามารถดึงข้อมูลได้", "error");
      }
    }

    function populateNameDropdown() {
      const select = document.getElementById('f_name');
      if (nameList.length === 0) {
        select.innerHTML = `<option value="">ไม่พบรายชื่อในชีต 'รายชื่อ'</option>`;
        return;
      }
      select.innerHTML = nameList.map(n => `<option value="${n}">${n}</option>`).join('');
    }

    function parseThaiDate(dateStr) {
      if (!dateStr) return null;
      const parts = dateStr.trim().split(/\s+/);
      if (parts.length < 3) return null;
      const d = parseInt(parts[0]), m = thaiMonths.indexOf(parts[1]), y = parseInt(parts[2]) - 543;
      return new Date(y, m, d);
    }

    function renderCalendar() {
      const daysDiv = document.getElementById('calendarDays');
      daysDiv.innerHTML = '';
      const vY = currentViewDate.getFullYear(), vM = currentViewDate.getMonth();
      document.getElementById('monthTitle').innerText = `${thaiMonths[vM]} ${vY + 543}`;

      let firstDay = new Date(vY, vM, 1).getDay();
      let startOffset = firstDay === 0 ? 6 : firstDay - 1; 

      const daysInMonth = new Date(vY, vM + 1, 0).getDate();
      for (let i = 0; i < startOffset; i++) daysDiv.innerHTML += `<div class="cell bg-slate-50/50 border-0"></div>`;

      for (let day = 1; day <= daysInMonth; day++) {
        const dObj = new Date(vY, vM, day), dow = dObj.getDay();
        const isWE = (dow === 0 || dow === 6), isToday = dObj.toDateString() === new Date().toDateString();
        
        const dayEvents = otData.filter(it => {
          const itD = parseThaiDate(it.date);
          return itD && itD.getDate() === day && itD.getMonth() === vM && itD.getFullYear() === vY;
        });

        daysDiv.innerHTML += `
          <div class="cell p-2 ${isToday ? 'today' : ''} ${isWE ? 'weekend' : ''}" onclick="showDetails(${day}, ${vM}, ${vY})">
            <span class="text-[11px] font-bold ${dow === 0 ? 'text-rose-500' : (dow === 6 ? 'text-indigo-500' : 'text-slate-400')}">${day}</span>
            <div class="mt-2 space-y-1">
              ${dayEvents.map(ev => {
                let colors = getColorForName(ev.name);
                let shortName = ev.name.split(' ')[0]; // แสดงแค่ชื่อจริง
                return `
                <div class="event-badge ${colors.badge}">
                  <span class="font-bold">${shortName}</span> <span class="text-[9px]">(${ev.shift})</span>
                  ${ev.timeIn ? `<br><span class="text-[9px] font-normal opacity-80">${ev.timeIn}-${ev.timeOut}</span>` : ''}
                </div>`;
              }).join('')}
            </div>
          </div>`;
      }
    }

    function showDetails(day, month, year) {
      const tDate = `${day} ${thaiMonths[month]} ${year + 543}`;
      const evs = otData.filter(it => it.date === tDate);
      let html = `<div class="text-center mb-6"><p class="text-teal-600 font-black text-xl">${tDate}</p></div>`;
      
      if(evs.length === 0) {
        html += `<p class="text-center text-slate-400 py-6 text-sm">ไม่มีข้อมูลเบิก OT ในวันนี้</p>`;
      } else {
        evs.forEach(ev => {
          let colors = getColorForName(ev.name);
          
          html += `
          <div class="p-5 rounded-[1.5rem] ${colors.bg} border ${colors.border} mb-3 relative shadow-sm">
            <p class="font-bold text-lg ${colors.text}">${ev.name}</p>
            <div class="mt-2 grid grid-cols-2 gap-2 text-xs text-slate-600">
              <div><span class="text-slate-400 block">เวรปฏิบัติงาน</span><span class="font-bold text-slate-700">${ev.shift}</span></div>
              <div><span class="text-slate-400 block">เวลา</span><span class="font-bold text-slate-700">${ev.timeIn || '-'} ถึง ${ev.timeOut || '-'}</span></div>
            </div>
            <div class="mt-3 flex gap-2">
              ${ev.file1 ? `<a href="${ev.file1}" target="_blank" class="flex-1 bg-white hover:bg-slate-50 text-slate-600 border border-slate-200 text-center py-2 rounded-lg text-[10px] font-bold shadow-sm transition-all"><i class="fas fa-file-pdf text-rose-500"></i> ไฟล์ 1</a>` : ''}
              ${ev.file2 ? `<a href="${ev.file2}" target="_blank" class="flex-1 bg-white hover:bg-slate-50 text-slate-600 border border-slate-200 text-center py-2 rounded-lg text-[10px] font-bold shadow-sm transition-all"><i class="fas fa-file-pdf text-rose-500"></i> ไฟล์ 2</a>` : ''}
            </div>
          </div>`;
        });
      }
      document.getElementById('viewContent').innerHTML = html;
      openModal('viewModal');
    }

    function openEditForm() {
      const vY = currentViewDate.getFullYear(), vM = String(currentViewDate.getMonth() + 1).padStart(2, '0');
      document.getElementById('otForm').reset();
      document.getElementById('f_date_raw').value = `${vY}-${vM}-01`; 
      updateThaiDateDisplay(); 
      openModal('editModal');
    }

    function updateThaiDateDisplay() {
      const val = document.getElementById('f_date_raw').value; if(!val) return;
      const d = new Date(val); document.getElementById('f_date_thai').value = `${d.getDate()} ${thaiMonths[d.getMonth()]} ${d.getFullYear() + 543}`;
    }

    const toBase64 = file => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result);
      reader.onerror = error => reject(error);
    });

    async function handleSave(e) {
      e.preventDefault();
      Swal.fire({ title: 'กำลังบันทึกและอัปโหลดไฟล์', html: 'กรุณารอสักครู่ (อาจใช้เวลา 10-20 วินาที)', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      
      const f1 = document.getElementById('f_file1').files[0];
      const f2 = document.getElementById('f_file2').files[0];

      const payload = { 
        date: document.getElementById('f_date_thai').value, 
        name: document.getElementById('f_name').value, 
        shift: document.getElementById('f_shift').value,
        timeIn: document.getElementById('f_timeIn').value,
        timeOut: document.getElementById('f_timeOut').value,
        file1Data: f1 ? await toBase64(f1) : null,
        file1Name: f1 ? f1.name : "",
        file2Data: f2 ? await toBase64(f2) : null,
        file2Name: f2 ? f2.name : ""
      };
      
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'saveOT', payload: payload }),
          headers: { 'Content-Type': 'text/plain;charset=utf-8' }
        });
        const result = await response.json();
        closeModal('editModal');
        Swal.fire({ icon: 'success', title: 'สำเร็จ', text: result.message, timer: 2000 });
        fetchData();
      } catch (error) {
        Swal.fire("ข้อผิดพลาด", "ไม่สามารถอัปโหลดข้อมูลได้", "error");
      }
    }

    function changeMonth(o) { currentViewDate.setMonth(currentViewDate.getMonth() + o); renderCalendar(); }
    function openModal(id) { document.getElementById(id).classList.remove('hidden'); document.getElementById(id).classList.add('flex'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); document.getElementById(id).classList.remove('flex'); }
  </script>
</body>
</html>
